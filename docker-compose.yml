version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: iss-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Один раз: бакет iss-bucket, анонимное чтение (иначе браузер получит 403) + CORS для Range при воспроизведении видео
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./docker/minio-cors.xml:/tmp/cors.xml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 minioadmin minioadmin && break
          sleep 1
        done
        mc mb -p local/iss-bucket || true
        mc anonymous set download local/iss-bucket
        mc cors set local/iss-bucket /tmp/cors.xml || true
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: iss-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: iss-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: 172.17.0.1:5433
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  minio_data:
