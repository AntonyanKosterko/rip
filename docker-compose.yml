version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: iss-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer
    container_name: iss-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: 172.17.0.1:5433
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  minio_data:
