{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}}</title>
    <!-- CSS: тёмно-синяя тема, красные квадратные кнопки
         Основные цвета (из roscosmos.ru + правки):
         1. Фон хедера/футера: #000B1D (тёмно-синий)
         2. Основной фон: #001233 (тёмно-синий)
         3. Акцентные кнопки: #D32F2F (красный, квадратные)
         4. Карточки: #0A1929 с голубой обводкой
         5. Текст: #FFFFFF, #B0BEC5
         Доп. цвета: #019DF8 (голубой акцент), #0348A3 (синий)
    -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <!-- Кнопка/иконка Домой -->
            <a href="/" class="home-btn" title="На главную — Видимость МКС">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="home-btn-text">Видимость МКС</span>
            </a>
        </div>
    </header>

    {{if .ShowSearch}}
    <!-- Подхедер: поиск + корзина (под хедером, не внутри) -->
    <div class="sub-header">
        <div class="sub-header-content">
            <!-- Поиск -->
            <form method="get" action="/" class="search-form">
                <input type="text"
                       name="search"
                       value="{{.SearchQuery}}"
                       placeholder="Поиск по названию точки..."
                       class="search-input">
                <button type="submit" class="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
            </form>

            {{if .ShowCart}}
            <!-- Корзина-иконка (спутник/МКС) -->
            {{if .HasCart}}
            <a href="/iss-positions/{{.PosID}}/" class="cart-icon" title="Текущая заявка">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Спутник / МКС -->
                    <circle cx="12" cy="12" r="3"/>
                    <line x1="3" y1="12" x2="9" y2="12"/>
                    <line x1="15" y1="12" x2="21" y2="12"/>
                    <rect x="1" y="10" width="4" height="4" rx="0.5"/>
                    <rect x="19" y="10" width="4" height="4" rx="0.5"/>
                    <line x1="12" y1="9" x2="12" y2="5"/>
                    <circle cx="12" cy="4" r="1"/>
                </svg>
                <span class="cart-badge">{{.PosCount}}</span>
            </a>
            {{else}}
            <span class="cart-icon cart-inactive" title="Нет активной заявки">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
                    <!-- Спутник / МКС (неактивная) -->
                    <circle cx="12" cy="12" r="3"/>
                    <line x1="3" y1="12" x2="9" y2="12"/>
                    <line x1="15" y1="12" x2="21" y2="12"/>
                    <rect x="1" y="10" width="4" height="4" rx="0.5"/>
                    <rect x="19" y="10" width="4" height="4" rx="0.5"/>
                    <line x1="12" y1="9" x2="12" y2="5"/>
                    <circle cx="12" cy="4" r="1"/>
                </svg>
                <span class="cart-badge cart-badge-empty">0</span>
            </span>
            {{end}}
            {{end}}
        </div>
    </div>
    {{end}}

    <main class="content">
        {{template "content" .}}
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 — Определение времени видимости МКС с Земли</p>
            <p class="footer-sub">Лабораторная работа №2 — РИП, МГТУ им. Н.Э. Баумана</p>
        </div>
    </footer>
</body>
</html>
{{end}}
